<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Warm amber DB cylinder with a little "AI" spark on top. -->
  <defs>
    <linearGradient id="db" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e42"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- rounded cream background so it reads on any browser tab -->
  <rect width="64" height="64" rx="12" fill="#faf3e7"/>

  <!-- database cylinder -->
  <g transform="translate(12 14)">
    <ellipse cx="20" cy="6"  rx="18" ry="6" fill="url(#db)"/>
    <rect    x="2"  y="6"    width="36" height="24" fill="url(#db)"/>
    <ellipse cx="20" cy="30" rx="18" ry="6" fill="#b45309"/>
    <!-- disk stripes -->
    <ellipse cx="20" cy="14" rx="18" ry="6" fill="none" stroke="#fff9ee" stroke-opacity="0.55" stroke-width="1.4"/>
    <ellipse cx="20" cy="22" rx="18" ry="6" fill="none" stroke="#fff9ee" stroke-opacity="0.55" stroke-width="1.4"/>
  </g>

  <!-- AI spark -->
  <g transform="translate(44 8)" fill="#7c8a2d">
    <path d="M6 0 L7.6 4.4 L12 6 L7.6 7.6 L6 12 L4.4 7.6 L0 6 L4.4 4.4 Z"/>
  </g>
</svg>
